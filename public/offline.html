<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - GA Facility</title>
    <meta name="theme-color" content="#0d6efd">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Figtree, Arial, sans-serif;
            background: linear-gradient(180deg, #f4f8fd 0%, #e9f0f9 100%);
            color: #0a1628;
        }

        .offline-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
            padding: 28px;
            text-align: center;
        }

        .offline-badge {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #0d6efd, #74b4ff);
            color: #fff;
            font-size: 28px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.4rem;
        }

        p {
            margin: 0 0 20px;
            color: #526072;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 12px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="offline-card">
        <div class="offline-badge">GA</div>
        <h1>Anda sedang offline</h1>
        <p>Koneksi internet sedang tidak tersedia. Coba lagi setelah jaringan kembali aktif.</p>
        <a href="/">Coba Muat Ulang</a>
    </main>
</body>
</html>
